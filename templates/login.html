<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登入 · 好好生活</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <div class="page">
      <header class="site-header">
        <a class="brand" href="{{ url_for('index') }}" aria-label="好好生活，回到首頁">
          <span class="brand-mark" aria-hidden="true">✳</span>
          好好生活 <span class="brand-en">WELL LIVING</span>
        </a>
      </header>
      <main>
        <section class="calculator login-card" aria-labelledby="login-title">
          <div class="card-heading">
            <div>
              <span class="section-number">ACCOUNT / LOGIN</span>
              <h1 id="login-title">登入</h1>
            </div>
          </div>
          {% if error %}
            <p class="form-error" role="alert">{{ error }}</p>
          {% endif %}
          <form method="post" action="{{ url_for('login') }}" novalidate>
            <div class="field">
              <label for="username">帳號 <span>USERNAME</span></label>
              <input id="username" name="username" type="text" autocomplete="username" value="{{ username }}" required>
            </div>
            <div class="field">
              <label for="password">密碼 <span>PASSWORD</span></label>
              <input id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <button type="submit">登入 <span aria-hidden="true">↗</span></button>
          </form>
        </section>
      </main>
      <footer>© 好好生活 <span>TAKE CARE, EVERY DAY.</span></footer>
    </div>
  </body>
</html>
